name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Go dependencies
        run: cd server/go && go mod download

      - name: Install frontend dependencies
        run: npm ci

      # T1：格式门禁。gofmt 不需要依赖，可对全部 Go 模块（含仅能在 Windows 构建的桌面壳）统一检查。
      - name: Go format check
        run: |
          unformatted=$(gofmt -l server/go apps/desktop)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w ："
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: cd server/go && go vet ./...

      - name: Go test
        run: cd server/go && go test -cover ./...

      - name: TypeScript check
        run: cd apps/web && ./node_modules/.bin/tsc --noEmit

      - name: Build Go backend
        run: cd server/go && go build ./...

      - name: Build frontend
        run: npm run build:web
