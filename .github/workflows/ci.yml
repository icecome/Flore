name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Go dependencies
        run: cd server/go && go mod download

      - name: Install frontend dependencies
        run: cd apps/web && npm ci

      # T1：格式门禁。gofmt 不需要依赖，可对全部 Go 模块（含仅能在 Windows 构建的桌面壳）统一检查。
      - name: Go format check
        run: |
          unformatted=$(gofmt -l server/go apps/desktop)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w ："
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: cd server/go && go vet ./...

      - name: Go test
        run: cd server/go && go test -cover ./...

      - name: TypeScript check
        run: cd apps/web && ./node_modules/.bin/tsc --noEmit

      - name: Build Go backend
        run: cd server/go && go build ./...

      # 桌面壳编译检查：拦截 //go:build 标签错误与类型错误（不跑 wails build，GTK/WebKit 依赖成本高）。
      # frontend/dist 有 //go:embed all:frontend/dist，需先建含占位文件的目录。
      - name: Desktop compile check
        run: |
          mkdir -p apps/desktop/frontend/dist
          touch apps/desktop/frontend/dist/.gitkeep
          cd apps/desktop && go mod download && go build ./... && go vet ./...

      # 桌面壳安全关键路径单测：验签（篡改/错误密钥/缺签名拒绝）、zip-slip、版本比较。
      # 测试文件无平台标签、ubuntu 可运行，此前从未在 CI 执行（M-R2）。
      - name: Desktop updater tests
        run: |
          cd apps/desktop && go test ./internal/updater/...

      - name: Build frontend
        run: npm run build:web
