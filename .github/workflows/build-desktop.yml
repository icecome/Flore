name: Desktop Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
          - os: macos-latest
            goos: darwin
          - os: ubuntu-latest
            goos: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libgoocanvas-2.0-dev

      - name: Install Go dependencies
        run: cd server/go && go mod download

      - name: Install desktop dependencies
        run: cd apps/desktop && go mod download

      - name: Install frontend dependencies
        run: cd apps/web && npm ci

      - name: Go vet (desktop)
        run: |
          # main.go 有 //go:embed all:frontend/dist，需先创建目录否则 embed 编译失败
          mkdir -p apps/desktop/frontend/dist
          cd apps/desktop && go vet ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          cd apps/desktop
          node -e "require('fs').writeFileSync('version.go','package main\n\nvar version = \"ci\"\n')"
          wails build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flore-desktop-${{ matrix.goos }}
          path: apps/desktop/build/bin/
