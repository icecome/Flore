# Release workflow for Flore (自动更新分发).
#
# 触发：
#   - 推送 v* 标签（如 v0.1.0-20260805）自动发布
#   - workflow_dispatch 手动填写版本号发布
#
# 构建矩阵（双平台 × 安装包+便携包 = 4 个包）：
#   - windows-latest / amd64：便携 zip + NSIS 安装 exe
#   - macos-latest   / arm64：便携 zip + hdiutil 安装 dmg
#
# 产物命名：
#   flore-portable-windows-amd64-<ver>.zip      Windows 便携版
#   flore-setup-windows-amd64-<ver>.exe         Windows 安装版（NSIS）
#   flore-portable-darwin-arm64-<ver>.zip       macOS 便携版
#   flore-setup-darwin-arm64-<ver>.dmg          macOS 安装版（未签名）
#
# 发布：
#   - R2：仅上传两平台安装包（自动更新源）+ update.json（manifest 含 windows,darwin 的 setup）
#   - GitHub Release：4 个包 + update.json（供手动下载）
#
# 注意：macOS 包未做 Apple 开发者签名/公证，下载后首次打开会被 Gatekeeper 拦截，
#       用户需右键「打开」或 `xattr -d com.apple.quarantine <文件>` 放行。
#
# 所需 GitHub Secrets：
#   R2_ACCOUNT_ID          Cloudflare 账户 ID
#   R2_ACCESS_KEY_ID       R2 S3 兼容访问密钥 ID
#   R2_SECRET_ACCESS_KEY   R2 S3 兼容私密访问密钥
#   R2_BUCKET_NAME         R2 存储桶名称

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 0.1.0-20260805）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Go dependencies
        run: |
          cd server/go && go mod download
          cd ../../apps/desktop && go mod download

      - name: Install web dependencies
        run: cd apps/web && npm ci

      # ---- Windows：便携 zip + NSIS 安装 exe ----
      - name: Build & package (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd apps/desktop

          # 生成 version.go 并同步 wails.json productVersion
          node sync-version.mjs "$VERSION"

          # 构建前端二进制（-ldflags 注入后端版本号，否则 /api/version 恒为 "dev"）
          wails build -ldflags "-X github.com/rss/go-server/internal/handlers.appVersion=$VERSION"

          # 便携版
          FE_BIN=build/bin/Flore.exe
          go run ./cmd/package-tool -edition portable -version "$VERSION" -os windows -arch amd64 -feBin "$FE_BIN" -clean false

          # 安装版（NSIS）
          mkdir -p build/windows/installer
          cp installer/wails_tools.nsh build/windows/installer/
          choco install nsis -y || (sleep 5 && choco install nsis -y)
          MAKENSIS=""
          for p in "/c/Program Files (x86)/NSIS/makensis.exe" "/c/ProgramData/chocolatey/lib/nsis/tools/makensis.exe"; do
            if [ -f "$p" ]; then MAKENSIS="$p"; break; fi
          done
          if [ -z "$MAKENSIS" ]; then
            echo "makensis.exe not found"; exit 1
          fi
          "$MAKENSIS" -DARG_WAILS_AMD64_BINARY="build\bin\Flore.exe" installer.nsi
          go run ./cmd/package-tool -edition setup -version "$VERSION" -os windows -arch amd64 -setupBin build/bin/Flore-installer.exe
          rm -rf build/Flore-portable

      # ---- macOS：便携 zip + hdiutil 安装 dmg（arm64）----
      - name: Build & package (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd apps/desktop

          node sync-version.mjs "$VERSION"

          wails build -ldflags "-X github.com/rss/go-server/internal/handlers.appVersion=$VERSION"

          # 便携版（Flore.app 打成 zip）
          FE_BIN=build/bin/Flore.app
          go run ./cmd/package-tool -edition portable -version "$VERSION" -os darwin -arch arm64 -feBin "$FE_BIN" -clean false

          # 安装版：ad-hoc 签名避免「app 已损坏」提示，再打成 dmg
          if codesign --deep --force --sign - build/bin/Flore.app; then
            echo "ad-hoc codesign OK"
          else
            echo "::warning::ad-hoc codesign 失败 — macOS 包未签名，Gatekeeper 会拦截（用户右键打开或 xattr -d com.apple.quarantine 放行）"
          fi
          hdiutil create -volname Flore -srcfolder build/bin/Flore.app -ov -format UDZO "build/flore-setup-darwin-arm64-${VERSION}.dmg"
          rm -rf build/Flore-portable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flore-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: warn
          path: |
            apps/desktop/build/flore-portable-${{ matrix.goos }}-${{ matrix.goarch }}-*.zip
            apps/desktop/build/flore-setup-${{ matrix.goos }}-${{ matrix.goarch }}-*.exe
            apps/desktop/build/flore-setup-${{ matrix.goos }}-${{ matrix.goarch }}-*.dmg

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Create tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect build artifacts
        run: |
          mkdir -p apps/desktop/build
          cp artifacts/flore-*/* apps/desktop/build/
          ls -la apps/desktop/build/

      - name: Generate update manifest
        run: |
          cd apps/desktop
          go mod download
          go run ./cmd/gen-manifest \
            -version "${{ steps.ver.outputs.version }}" \
            -dir ./build \
            -baseURL https://cdn-dl.icecome.com \
            -githubRepo ${{ github.repository }} \
            -notes "Flore ${{ steps.ver.outputs.tag }}" \
            -platforms windows,darwin \
            -variant setup \
            -out ./build/update.json

      - name: Sign update manifest
        env:
          FLORE_UPDATE_SIGNING_KEY: ${{ secrets.FLORE_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$FLORE_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::未配置 FLORE_UPDATE_SIGNING_KEY，跳过签名（桌面端更新将因验签失败被拒绝）"
            exit 0
          fi
          printf '%s' "$FLORE_UPDATE_SIGNING_KEY" > /tmp/flore-sign.key
          node scripts/sign-update.mjs apps/desktop/build/update.json /tmp/flore-sign.key

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        run: |
          V="${{ steps.ver.outputs.version }}"
          # R2 只上传安装包（自动更新源），不上传便携包
          aws s3 cp "apps/desktop/build/flore-setup-windows-amd64-${V}.exe" "s3://${{ secrets.R2_BUCKET_NAME }}/v$V/"
          aws s3 cp "apps/desktop/build/flore-setup-darwin-arm64-${V}.dmg" "s3://${{ secrets.R2_BUCKET_NAME }}/v$V/"
          aws s3 cp "apps/desktop/build/update.json" "s3://${{ secrets.R2_BUCKET_NAME }}/update.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Flore ${{ steps.ver.outputs.tag }}
          files: |
            apps/desktop/build/flore-portable-windows-amd64-*.zip
            apps/desktop/build/flore-setup-windows-amd64-*.exe
            apps/desktop/build/flore-portable-darwin-arm64-*.zip
            apps/desktop/build/flore-setup-darwin-arm64-*.dmg
            apps/desktop/build/update.json
          fail_on_unmatched_files: true
