# Release workflow for Flore (W3 自动更新分发，跨平台构建).
#
# 触发：
#   - 推送 v* 标签（如 v0.1.0-20260802）自动发布
#   - workflow_dispatch 手动填写版本号发布
#
# 流程：
#   1) build 矩阵（windows/macos/ubuntu）各自构建：
#      - wails build -> package-tool portable 产出 flore-portable-<os>-<arch>-<version>.zip
#      - Windows 额外：makensis + package-tool setup 产出 flore-setup-windows-amd64-<version>.exe
#   2) release 作业汇总所有产物 -> gen-manifest（仅 windows 入 manifest）-> 上传 R2
#      -> 发 GitHub Release（含全部平台 zip + 安装包 exe + update.json）
#
# 命名规范（统一所有分发包）：
#   flore-portable-<os>-<arch>-<version>.zip       便携版
#   flore-setup-<os>-<arch>-<version>.exe           安装版（仅 Windows，NSIS）
#
# 所需 GitHub Secrets：
#   R2_ACCOUNT_ID          Cloudflare 账户 ID
#   R2_ACCESS_KEY_ID       R2 S3 兼容访问密钥 ID
#   R2_SECRET_ACCESS_KEY   R2 S3 兼容私密访问密钥
#   R2_BUCKET_NAME         R2 存储桶名称
#
# 前置：Cloudflare R2 存储桶需绑定自定义域 cdn-dl.icecome.com（公开访问），
#       否则 update.json 与 zip 的公网 URL 无法解析。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 0.1.0-20260802）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgoocanvas-2.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Go dependencies
        run: |
          cd server/go && go mod download
          cd ../../apps/desktop && go mod download

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Build & package
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd apps/desktop

          # 生成 version.go（替代 ldflags 注入，Wails 构建流程中 ldflags 不生效）
          node -e "require('fs').writeFileSync('version.go','package main\n\nvar version = \"' + '$VERSION' + '\"\n')"

          # 构建二进制（Linux 需 webkit2gtk_4_1 tag，Wails v2.13 支持）
          TAGS=""
          if [ "${{ matrix.goos }}" = "linux" ]; then TAGS="-tags webkit2gtk_4_1"; fi
          wails build $TAGS

          # 生成 wails_tools.nsh（供 NSIS 安装器使用）
          mkdir -p build/windows/installer
          cp installer/wails_tools.nsh build/windows/installer/

          # 便携版
          FE_BIN=build/bin/Flore
          if [ "${{ matrix.goos }}" = "windows" ]; then FE_BIN=build/bin/Flore.exe; fi
          if [ "${{ matrix.goos }}" = "darwin" ]; then FE_BIN=build/bin/Flore.app; fi
          go run ./cmd/package-tool -edition portable -version "$VERSION" -os ${{ matrix.goos }} -arch ${{ matrix.goarch }} -feBin "$FE_BIN" -clean false

          # Windows 安装版（仅此平台）
          if [ "${{ matrix.goos }}" = "windows" ]; then
            choco install nsis -y
            makensis installer.nsi
            go run ./cmd/package-tool -edition setup -version "$VERSION" -os windows -arch amd64 -setupBin build/bin/Flore-installer.exe
            # 清理便携目录（NSIS 已用毕）
            rm -rf build/Flore-portable
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            apps/desktop/build/flore-portable-${{ matrix.goos }}-${{ matrix.goarch }}-*.zip
            apps/desktop/build/flore-setup-${{ matrix.goos }}-${{ matrix.goarch }}-*.exe

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Create tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect build artifacts
        run: |
          mkdir -p apps/desktop/build
          cp artifacts/flore-*/* apps/desktop/build/
          ls -la apps/desktop/build/

      - name: Generate update manifest (windows only)
        run: |
          cd apps/desktop
          go run ./cmd/gen-manifest \
            -version "${{ steps.ver.outputs.version }}" \
            -dir ./build \
            -baseURL https://cdn-dl.icecome.com \
            -githubRepo icecome/Flore \
            -notes "Flore ${{ steps.ver.outputs.tag }}" \
            -platforms windows \
            -out ./build/update.json

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        run: |
          V="${{ steps.ver.outputs.version }}"
          aws s3 cp "apps/desktop/build/flore-portable-windows-amd64-${V}.zip" "s3://${{ secrets.R2_BUCKET_NAME }}/v$V/"
          aws s3 cp "apps/desktop/build/update.json" "s3://${{ secrets.R2_BUCKET_NAME }}/update.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Flore ${{ steps.ver.outputs.tag }}
          files: |
            apps/desktop/build/flore-portable-*.zip
            apps/desktop/build/flore-setup-*.exe
            apps/desktop/build/update.json
          fail_on_unmatched_files: true