# Release workflow for Flore (W3 自动更新分发).
#
# 触发：
#   - 推送 v* 标签（如 v0.1.0-20260802）自动发布
#   - workflow_dispatch 手动填写版本号发布
#
# 流程：
#   1) build（仅 Windows）：
#      - wails build -> package-tool portable 产出 flore-portable-windows-amd64-<version>.zip
#      - makensis + package-tool setup 产出 flore-setup-windows-amd64-<version>.exe
#   2) release 作业：
#      - R2：上传 Windows 便携包 + update.json
#      - GitHub Release：Windows 便携包 + 安装 exe + update.json
#
# 备注：macOS/Linux 暂时注释，待问题解决后再开启。
#
# 命名规范：
#   flore-portable-windows-amd64-<version>.zip    便携版
#   flore-setup-windows-amd64-<version>.exe       安装版（NSIS）
#
# 所需 GitHub Secrets：
#   R2_ACCOUNT_ID          Cloudflare 账户 ID
#   R2_ACCESS_KEY_ID       R2 S3 兼容访问密钥 ID
#   R2_SECRET_ACCESS_KEY   R2 S3 兼容私密访问密钥
#   R2_BUCKET_NAME         R2 存储桶名称

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 0.1.0-20260802）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # TODO: 恢复 macOS/Linux 构建（待问题排查完成后取消注释）
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     include:
    #       - os: windows-latest
    #         goos: windows
    #         goarch: amd64
    #       - os: macos-latest
    #         goos: darwin
    #         goarch: arm64
    #       - os: ubuntu-latest
    #         goos: linux
    #         goarch: amd64
    #     runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # TODO: macOS/Linux 依赖安装（待恢复构建时取消注释）
      # - name: Install Linux build deps
      #   if: matrix.goos == 'linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgoocanvas-2.0-dev
      #     sudo ln -sf webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc 2>/dev/null || true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Go dependencies
        run: |
          cd server/go && go mod download
          cd ../../apps/desktop && go mod download

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Build & package
        shell: bash
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          cd apps/desktop

          # 生成 version.go
          node -e "require('fs').writeFileSync('version.go','package main\n\nvar version = \"' + '$VERSION' + '\"\n')"

          # 构建后端二进制
          BE_BIN="build/bin/florebackend.exe"
          cd ../../server/go
          mkdir -p $(dirname "../../apps/desktop/$BE_BIN")
          go build -ldflags "-X github.com/rss/go-server/internal/handlers.appVersion=$VERSION" -o "../../apps/desktop/$BE_BIN" ./cmd/main.go
          cd ../../apps/desktop

          # 构建前端二进制
          wails build

          # 生成 wails_tools.nsh（供 NSIS 安装器使用）
          mkdir -p build/windows/installer
          cp installer/wails_tools.nsh build/windows/installer/

          # 便携版
          FE_BIN=build/bin/Flore.exe
          go run ./cmd/package-tool -edition portable -version "$VERSION" -os windows -arch amd64 -feBin "$FE_BIN" -clean false

          # Windows 安装版
          choco install nsis -y
          MAKENSIS=""
          for p in "/c/Program Files (x86)/NSIS/makensis.exe" "/c/ProgramData/chocolatey/lib/nsis/tools/makensis.exe"; do
            if [ -f "$p" ]; then MAKENSIS="$p"; break; fi
          done
          if [ -z "$MAKENSIS" ]; then
            echo "makensis.exe not found"; exit 1
          fi
          "$MAKENSIS" -DARG_WAILS_AMD64_BINARY="build\bin\Flore.exe" installer.nsi
          go run ./cmd/package-tool -edition setup -version "$VERSION" -os windows -arch amd64 -setupBin build/bin/Flore-installer.exe
          rm -rf build/Flore-portable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flore-windows-amd64
          path: |
            apps/desktop/build/flore-portable-windows-amd64-*.zip
            apps/desktop/build/flore-setup-windows-amd64-*.exe

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Create tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect build artifacts
        run: |
          mkdir -p apps/desktop/build
          cp artifacts/flore-*/* apps/desktop/build/
          ls -la apps/desktop/build/

      - name: Generate update manifest
        run: |
          cd apps/desktop
          go run ./cmd/gen-manifest \
            -version "${{ steps.ver.outputs.version }}" \
            -dir ./build \
            -baseURL https://cdn-dl.icecome.com \
            -githubRepo icecome/Flore \
            -notes "Flore ${{ steps.ver.outputs.tag }}" \
            -platforms windows \
            -out ./build/update.json

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        run: |
          V="${{ steps.ver.outputs.version }}"
          # R2 只上传安装包（自动更新源），不上传便携包
          aws s3 cp "apps/desktop/build/flore-setup-windows-amd64-${V}.exe" "s3://${{ secrets.R2_BUCKET_NAME }}/v$V/"
          aws s3 cp "apps/desktop/build/update.json" "s3://${{ secrets.R2_BUCKET_NAME }}/update.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Flore ${{ steps.ver.outputs.tag }}
          files: |
            apps/desktop/build/flore-portable-windows-amd64-*.zip
            apps/desktop/build/flore-setup-windows-amd64-*.exe
            apps/desktop/build/update.json
          fail_on_unmatched_files: true
